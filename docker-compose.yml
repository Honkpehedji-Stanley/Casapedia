version: '3.8'

x-airflow-common:
  &airflow-common
  image: casapedia-airflow:latest
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: casapedia-airflow-secret-key
    PYTHONPATH: /opt/airflow
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin123
    CASAPEDIA_S3_BUCKET: casapedia-datalake
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./spark_jobs:/opt/airflow/spark_jobs # Partage des scripts Spark
    - ./storage:/opt/airflow/storage
    - ./libs:/opt/airflow/libs
  depends_on:
    - postgres-airflow
    - minio

services:
  # ==========================================
  # 1. BASES DE DONNÉES APP (CASAPEDIA)
  # ==========================================
  postgres-app:
    image: postgres:15-alpine
    container_name: casapedia_postgres
    environment:
      POSTGRES_USER: casapedia_user
      POSTGRES_PASSWORD: casapedia_password
      POSTGRES_DB: casapedia_db
    ports:
      - "5433:5432" # Port 5433 sur l'hôte pour éviter les conflits
    volumes:
      - pgdata_app:/var/lib/postgresql/data
    networks:
      - casapedia_network

  mongodb:
    image: mongo:6.0
    container_name: casapedia_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
    ports:
      - "27017:27017" # Port MongoDB standard
    volumes:
      - mongodata:/data/db
    networks:
      - casapedia_network

  minio:
    image: minio/minio:latest
    container_name: casapedia_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - casapedia_network

  minio-init:
    image: minio/mc:latest
    container_name: casapedia_minio_init
    depends_on:
      - minio
    entrypoint: /bin/sh -c
    command: >-
      "until (mc alias set casapedia http://minio:9000 minioadmin minioadmin123) do sleep 2; done;
      mc mb -p casapedia/casapedia-datalake || true;
      mc anonymous set private casapedia/casapedia-datalake || true;"
    networks:
      - casapedia_network

  # ==========================================
  # 2. CLUSTER BIG DATA (APACHE SPARK)
  # ==========================================
  spark-master:
    image: casapedia-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: casapedia_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - CASAPEDIA_S3_BUCKET=casapedia-datalake
    ports:
      - "8080:8080" # Interface Web Spark Master
      - "7077:7077" # Port de soumission des jobs cluster
    volumes:
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./storage:/opt/airflow/storage
    networks:
      - casapedia_network

  spark-worker:
    image: casapedia-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: casapedia_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - CASAPEDIA_S3_BUCKET=casapedia-datalake
    ports:
      - "8081:8081" # Interface Web Worker
    volumes:
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./storage:/opt/airflow/storage
    depends_on:
      - spark-master
    networks:
      - casapedia_network

  # ==========================================
  # 3. ORCHESTRATEUR (APACHE AIRFLOW)
  # ==========================================
  postgres-airflow:
    image: postgres:15-alpine
    container_name: casapedia_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    networks:
      - casapedia_network

  airflow-init:
    <<: *airflow-common
    container_name: casapedia_airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin # Mdp par défaut pour l'UI
    networks:
      - casapedia_network

  airflow-webserver:
    <<: *airflow-common
    container_name: casapedia_airflow_web
    command: webserver
    ports:
      - "8082:8080" # L'UI Airflow sera sur le port 8082
    depends_on:
      - postgres-airflow
      - airflow-init
    networks:
      - casapedia_network

  airflow-scheduler:
    <<: *airflow-common
    container_name: casapedia_airflow_scheduler
    command: scheduler
    depends_on:
      - postgres-airflow
      - airflow-init
    networks:
      - casapedia_network

volumes:
  pgdata_app:
  mongodata:
  pgdata_airflow:
  miniodata:

networks:
  casapedia_network:
    driver: bridge